# =============================================================================
# EcomFlow — Environnement de DEVELOPPEMENT
#
# Lance uniquement les dependances (PostgreSQL, Redis, MailHog). L'API et le
# front tournent sur la machine hote avec rechargement a chaud, ce qui donne
# une boucle de retour bien plus rapide qu'un montage de volume dans un
# conteneur Node sous Windows.
#
#   docker compose -f infra/docker/docker-compose.dev.yml up -d
#   npm run prisma:migrate
#   npm run seed
#   npm run dev:api      # terminal 1
#   npm run dev:web      # terminal 2
#
# Pour tout faire tourner en conteneur (API et web comprises) :
#   docker compose -f infra/docker/docker-compose.dev.yml --profile full up -d
# =============================================================================

name: ecomflow-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecomflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecomflow
      POSTGRES_PASSWORD: ecomflow_dev_password
      POSTGRES_DB: ecomflow
      # Collation deterministe : evite les surprises de tri entre machines.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecomflow -d ecomflow']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ecomflow-redis
    restart: unless-stopped
    # `appendonly` protege les jobs en file d'un redemarrage brutal.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Boite mail de developpement : capture tous les e-mails sortants.
  # Interface web : http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ecomflow-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    logging:
      driver: none

  # --- Profil « full » : API et front conteneurises ---------------------------

  api:
    profiles: ['full']
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: ecomflow-api
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://ecomflow:ecomflow_dev_password@postgres:5432/ecomflow?schema=public
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      MAIL_DRIVER: smtp
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../apps/api/src:/app/apps/api/src:ro
      - ../../packages/shared/src:/app/packages/shared/src:ro
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3001/api/v1/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    profiles: ['full']
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: ecomflow-web
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      INTERNAL_API_URL: http://api:3001/api/v1
    ports:
      - '3000:3000'
    depends_on:
      - api
    volumes:
      - ../../apps/web/src:/app/apps/web/src:ro
      - ../../packages/shared/src:/app/packages/shared/src:ro

volumes:
  postgres_data:
    name: ecomflow_postgres_data
  redis_data:
    name: ecomflow_redis_data
